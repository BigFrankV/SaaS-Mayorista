<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">S</div>
      <div class="logo-text-block">
        <div class="logo-text">SaaS Mayorista</div>
        <div class="logo-sub">Panel de Control</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Navegación</div>
      <a class="nav-item" href="#" data-page="dashboard">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </span>
        Dashboard
      </a>
      <a class="nav-item active" href="#" data-page="productos">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </span>
        Productos
        <span class="badge badge-secondary nav-badge">342</span>
      </a>
      <a class="nav-item" href="#" data-page="pos">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        </span>
        POS
      </a>
      <a class="nav-item" href="#" data-page="usuarios">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        Usuarios
        <span class="badge badge-info nav-badge">Admin</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="avatar" style="background: var(--color-primary);">JP</div>
      <div class="user-info">
        <div class="user-name">Juan Pérez</div>
        <div class="user-role">Administrador</div>
      </div>
    </div>
  </aside>

  <header class="topbar">
    <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
    <div class="topbar-breadcrumb">
      <a href="#" onclick="navigateTo('dashboard'); return false;">Dashboard</a>
      <span>/</span>
      <span>Productos</span>
    </div>
    <div class="topbar-title">Inventario</div>
    <div class="topbar-right">
      <div class="topbar-user">
        <div class="user-details">
          <div class="name">Juan Pérez</div>
          <div class="role">Administrador</div>
        </div>
        <div class="avatar" style="background: var(--color-primary);">JP</div>
      </div>
      <button class="btn btn-ghost btn-sm">Salir</button>
    </div>
  </header>

  <main class="main-content products-page">
    <div id="notification-area" style="margin-bottom: var(--space-4);"></div>

    <div class="page-header">
      <h1>Inventario <span class="header-count">(342 productos)</span></h1>
      <button class="btn btn-primary" onclick="openModal('producto-modal')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nuevo Producto
      </button>
    </div>

    <div class="filter-bar">
      <input type="text" class="input" placeholder="Buscar por nombre o código..." style="min-width: 260px;" />
      <select class="select" style="min-width: 160px;">
        <option value="">Todas las categorías</option>
        <option value="abarrotes">Abarrotes</option>
        <option value="lacteos">Lácteos</option>
        <option value="bebidas">Bebidas</option>
        <option value="limpieza">Limpieza</option>
        <option value="congelados">Congelados</option>
      </select>
      <button class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Filtrar
      </button>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table class="data-table" id="productos-table">
          <thead>
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Stock</th>
              <th>Stock Mín.</th>
              <th>Precio Venta</th>
              <th>Estado</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="pagination">
      <button class="page-btn" onclick="changePage(-1)" id="prev-page">‹ Anterior</button>
      <span class="page-info" id="page-info">Página 1 de 6</span>
      <button class="page-btn" onclick="changePage(1)" id="next-page">Siguiente ›</button>
    </div>
  </main>
</div>

<!-- Modal Producto -->
<div class="modal-overlay" id="producto-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Nuevo Producto</span>
      <button class="modal-close" onclick="closeModal('producto-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div style="display: flex; flex-direction: column; gap: var(--space-4);">
        <div class="row" style="margin: 0; gap: var(--space-4);">
          <div class="form-group" style="flex: 1;">
            <label for="prod-codigo">Código</label>
            <input type="text" id="prod-codigo" class="input" placeholder="PRO-001" />
          </div>
          <div class="form-group" style="flex: 2;">
            <label for="prod-nombre">Nombre del Producto</label>
            <input type="text" id="prod-nombre" class="input" placeholder="Ej: Arroz Grado 1 1kg" />
          </div>
        </div>
        <div class="form-group">
          <label for="prod-categoria">Categoría</label>
          <select id="prod-categoria" class="select">
            <option value="abarrotes">Abarrotes</option>
            <option value="lacteos">Lácteos</option>
            <option value="bebidas">Bebidas</option>
            <option value="limpieza">Limpieza</option>
            <option value="congelados">Congelados</option>
          </select>
        </div>
        <div class="row" style="margin: 0; gap: var(--space-4);">
          <div class="form-group" style="flex: 1;">
            <label for="prod-stock">Stock Actual</label>
            <input type="number" id="prod-stock" class="input" value="0" />
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="prod-stock-min">Stock Mínimo</label>
            <input type="number" id="prod-stock-min" class="input" value="10" />
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="prod-precio">Precio Venta</label>
            <input type="number" id="prod-precio" class="input" placeholder="$" />
          </div>
        </div>
        <div class="form-group">
          <label for="prod-descripcion">Descripción (opcional)</label>
          <textarea id="prod-descripcion" class="textarea" placeholder="Descripción del producto..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('producto-modal')">Cancelar</button>
      <button class="btn btn-primary" onclick="closeModal('producto-modal'); showNotification('success', 'Producto creado correctamente')">Guardar Producto</button>
    </div>
  </div>
</div>
