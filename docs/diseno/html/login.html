<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">S</div>
      <div class="logo-text-block">
        <div class="logo-name">SaaS Mayorista</div>
        <div class="logo-sub">Gestión para Distribuidoras</div>
      </div>
    </div>

    <div class="login-tabs">
      <button class="login-tab active" onclick="switchTab('login', 'login')">Iniciar Sesión</button>
      <button class="login-tab" onclick="switchTab('login', 'register')">Registrar Empresa</button>
    </div>

    <!-- Login Form -->
    <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" class="input" placeholder="admin@distribuidora.cl" required />
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" class="input" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Ingresar</button>
      <div class="login-footer-text">
        ¿Olvidaste tu contraseña? <a href="#">Recupérala aquí</a>
      </div>
    </form>

    <!-- Register Form -->
    <form class="login-form hidden" id="register-form" onsubmit="handleRegister(event)">
      <p class="login-subtitle">Registra tu empresa y crea el usuario administrador</p>
      <div class="form-group">
        <label for="reg-empresa">Nombre de la Empresa</label>
        <input type="text" id="reg-empresa" class="input" placeholder="Distribuidora del Sur SpA" required />
      </div>
      <div class="form-group">
        <label for="reg-rut">RUT Empresa</label>
        <input type="text" id="reg-rut" class="input" placeholder="76.123.456-7" required />
      </div>
      <div class="form-group">
        <label for="reg-giro">Giro</label>
        <input type="text" id="reg-giro" class="input" placeholder="Venta al por mayor de alimentos" required />
      </div>
      <hr class="form-divider" data-content="Datos del Administrador" />
      <span class="form-divider">Administrador</span>
      <div class="form-group">
        <label for="reg-nombre">Nombre Completo</label>
        <input type="text" id="reg-nombre" class="input" placeholder="Juan Pérez González" required />
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" class="input" placeholder="juan@distribuidora.cl" required />
      </div>
      <div class="form-group">
        <label for="reg-password">Contraseña</label>
        <input type="password" id="reg-password" class="input" placeholder="Mínimo 8 caracteres" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Crear Empresa</button>
      <div class="login-footer-text">
        Al registrarte aceptas nuestros <a href="#">Términos y Condiciones</a>
      </div>
    </form>
  </div>
</div>
