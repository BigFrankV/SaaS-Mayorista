spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

# OpenAPI/Swagger must not exist in prod: the routes return 404, and even if
# someone re-enabled springdoc, SecurityConfig keeps them authenticated
# (app.security.swagger-enabled is false here).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    cookie:
      # Prod is served over HTTPS (nginx + TLS), so the refresh cookie must be Secure.
      secure: ${REFRESH_COOKIE_SECURE:true}
    swagger-enabled: false
  bootstrap:
    # Off by default in prod; override consciously via APP_BOOTSTRAP_ENABLED=true
    # (BootstrapAdminPasswordGuard then requires APP_BOOTSTRAP_ADMIN_PASSWORD).
    enabled: ${APP_BOOTSTRAP_ENABLED:false}

logging:
  level:
    root: INFO
