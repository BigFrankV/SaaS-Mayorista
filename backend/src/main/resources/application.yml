server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: saas-mayorista-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mayorista_db}
    username: ${POSTGRES_USER:mayorista_user}
    password: ${POSTGRES_PASSWORD:mayorista_secure_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    login:
      rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:10}
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
    jwt:
      access-secret: ${JWT_ACCESS_SECRET:change_me_access_secret_very_long}
      refresh-secret: ${JWT_REFRESH_SECRET:change_me_refresh_secret_very_long}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:true}
    tenant-name: ${APP_BOOTSTRAP_TENANT_NAME:Distribuidora Demo}
    tenant-rut: ${APP_BOOTSTRAP_TENANT_RUT:76123456-7}
    tenant-giro: ${APP_BOOTSTRAP_TENANT_GIRO:Comercializacion de alimentos}
    tenant-address: ${APP_BOOTSTRAP_TENANT_ADDRESS:Casa matriz}
    admin-name: ${APP_BOOTSTRAP_ADMIN_NAME:Administrador}
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@mayorista.local}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
