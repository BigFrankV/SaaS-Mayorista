# Production stack for SaaS-Mayorista.
#
# TLS certificates (Let's Encrypt / certbot):
#   1. Point a DNS A record at this host, then set SSL_DOMAIN (and SSL_EMAIL) in .env
#   2. Start the stack (HTTP-only until certificates exist), then issue once:
#        docker compose -f infra/docker/prod/docker-compose.yml run --rm certbot certonly --webroot -w /var/www/certbot -d ${SSL_DOMAIN} --email ${SSL_EMAIL} --agree-tos --no-eff-email
#   3. Reload nginx so it picks up the new certificate:
#        docker compose -f infra/docker/prod/docker-compose.yml exec frontend nginx -s reload
#   Renewal (run periodically on the host, e.g. cron):
#        docker compose -f infra/docker/prod/docker-compose.yml run --rm certbot renew --webroot -w /var/www/certbot --quiet
#        docker compose -f infra/docker/prod/docker-compose.yml exec frontend nginx -s reload

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saas_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # S7: Redis is password-protected. PROD FAILS FAST if REDIS_PASSWORD is
    # missing from .env (compose aborts at parse time). The backend reads the
    # same variable via spring.data.redis.password (env_file injects .env).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - saas_network

  backend:
    build:
      context: ../../..
      dockerfile: infra/docker/prod/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Actuator is exposed via management.endpoints.web.exposure (see application.yml).
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Spring Boot + Flyway can take a while to be ready on first boot.
      start_period: 60s
    networks:
      - saas_network

  # Serves the built SPA and reverse-proxies /api/ to the backend over TLS.
  frontend:
    build:
      context: ../../..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Rendered into nginx.conf by envsubst at container startup (see `command`).
      SSL_DOMAIN: ${SSL_DOMAIN:-tu-dominio.com}
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # BusyBox wget ships with the nginx alpine image.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # nginx cannot expand env vars itself: render ${SSL_DOMAIN} into a copy of the
    # config and start nginx pointing at it (the bind mount stays untouched).
    command: /bin/sh -c "envsubst '$${SSL_DOMAIN}' < /etc/nginx/nginx.conf > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'"
    networks:
      - saas_network

  # Certificate issuer. Uncomment once SSL_DOMAIN / SSL_EMAIL are set in .env and the
  # domain resolves to this host, then issue certificates with the command in the header
  # comment (or `docker compose up certbot`). Keep it around for renewals.
  # certbot:
  #   image: certbot/certbot
  #   restart: "no"
  #   volumes:
  #     - certbot_data:/etc/letsencrypt
  #     - certbot_www:/var/www/certbot
  #   command: certonly --webroot -w /var/www/certbot -d ${SSL_DOMAIN} --email ${SSL_EMAIL} --agree-tos --no-eff-email
  #   networks:
  #     - saas_network

volumes:
  postgres_data:
  certbot_data:
  certbot_www:

networks:
  saas_network:
    driver: bridge
