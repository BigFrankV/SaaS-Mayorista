services:
  postgres:
    image: postgres:16-alpine
    container_name: mayorista_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - saas_network

  redis:
    image: redis:7-alpine
    container_name: mayorista_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    # S7: Redis is password-protected. The password comes from REDIS_PASSWORD
    # (or a known dev default when unset) and must match the one the backend
    # reads via spring.data.redis.password.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-mayorista_dev_redis}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-mayorista_dev_redis}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - saas_network

  pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: mayorista_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    configs:
      # I4: the DB password is never hardcoded. pgAdmin 4 cannot expand env
      # vars in servers.json, so the server definition points to a pgpass file
      # ("PassFile") that compose renders from the environment at parse time.
      - source: pgadmin_pgpass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400
    networks:
      - saas_network

  backend:
    build:
      context: ../../..
      dockerfile: infra/docker/dev/backend.Dockerfile
    container_name: mayorista_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Single source of truth for the active profile: SPRING_PROFILES_ACTIVE.
      # The dev Dockerfile CMD no longer forces -Dspring-boot.run.profiles=dev.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      BACKEND_PORT: ${BACKEND_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mayorista_dev_redis}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES}
      REFRESH_RATE_LIMIT_PER_MINUTE: ${REFRESH_RATE_LIMIT_PER_MINUTE}
      BOOTSTRAP_RATE_LIMIT_PER_MINUTE: ${BOOTSTRAP_RATE_LIMIT_PER_MINUTE}
      REGISTRATION_RATE_LIMIT_PER_MINUTE: ${REGISTRATION_RATE_LIMIT_PER_MINUTE}
      APP_BOOTSTRAP_ENABLED: ${APP_BOOTSTRAP_ENABLED}
      APP_BOOTSTRAP_TENANT_NAME: ${APP_BOOTSTRAP_TENANT_NAME}
      APP_BOOTSTRAP_TENANT_RUT: ${APP_BOOTSTRAP_TENANT_RUT}
      APP_BOOTSTRAP_TENANT_GIRO: ${APP_BOOTSTRAP_TENANT_GIRO}
      APP_BOOTSTRAP_TENANT_ADDRESS: ${APP_BOOTSTRAP_TENANT_ADDRESS}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ../../../backend:/workspace/backend
      - m2_cache:/root/.m2
    networks:
      - saas_network

configs:
  # I4: rendered from the environment at parse time (host/port/username/password).
  # Format: hostname:port:database:username:password ("*" = any database).
  pgadmin_pgpass:
    content: postgres:5432:*:${POSTGRES_USER}:${POSTGRES_PASSWORD}

volumes:
  postgres_data:
  m2_cache:
  pgadmin_data:

networks:
  saas_network:
    driver: bridge
