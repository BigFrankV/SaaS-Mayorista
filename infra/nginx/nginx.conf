# Production nginx configuration for SaaS-Mayorista.
# Served by the `frontend` service (nginx:1.27-alpine) in infra/docker/prod/docker-compose.yml.
# ${SSL_DOMAIN} is substituted by envsubst at container startup (see the compose `command`),
# so the same file works for any domain without manual edits.
#
# Responsibilities:
#   - Port 80: ACME challenge for certbot + redirect everything else to HTTPS
#   - Port 443: serve the built SPA (with index.html fallback) and reverse-proxy
#     the backend API (/api/*, /actuator/health) to the `backend` compose service

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile           on;
  keepalive_timeout  65;
  server_tokens      off;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
  gzip_min_length 1024;

  # HTTP server: ACME challenge + redirect to HTTPS
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server: SPA + API reverse proxy + security headers
  server {
    listen 443 ssl;
    http2 on;
    server_name ${SSL_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${SSL_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SSL_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # SPA: serve the built frontend, fall back to index.html for client-side routing
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Backend REST API (Spring Boot controllers are mounted under /api/v1/*)
    location /api/ {
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring Boot actuator health endpoint (uptime / load balancer checks)
    location /actuator/health {
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
