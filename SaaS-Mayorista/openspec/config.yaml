# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Spring Boot 3.3.2 / Java 17 / Maven (backend) + React 18 / TypeScript / Vite 5 (frontend)
  Architecture: Hexagonal (Ports & Adapters) — modular monolith backend
  Database: PostgreSQL 16 with Flyway migrations
  Cache: Redis 7 (token blocklist, session data)
  Modules: auth (JWT, multitenant), products (CRUD + stock), sales (POS, PDF), users, tenant, dashboard
  Frontend: React Router v6, Zustand (state), Axios (HTTP), strict TypeScript
  Infra: Docker Compose (dev+prod), Nginx, pgAdmin 8, Chile-specific validation (RUT, IVA 19%)
  CI: None yet

rules:
  proposal:
    - Include rollback plan for risky changes
    - Scope must identify affected modules (backend/frontend/both)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Reference hexagonal architecture layers (api/application/domain)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Backend: hexagonal structure (api/ → application/ → domain/)
      - Frontend: modules/{name}/{pages,components,...}, shared/{api,store,ui}
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "mvn -f backend/pom.xml clean verify"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  test_runner: null
  test_layers:
    unit: { available: false, tool: null }
    integration: { available: false, tool: null }
    e2e: { available: false, tool: null }
  coverage:
    available: false
    command: null
  quality:
    linter: { available: false, command: null }
    type_checker: { available: true, command: "npx tsc --noEmit" }
    formatter: { available: false, command: null }
  notes: |
    Backend has spring-boot-starter-test and spring-security-test in pom.xml
    but no test files exist (test/java/ directory is empty).
    Frontend has no test dependencies configured at all.
    Strict TDD disabled — add test runner and tests before enabling.
